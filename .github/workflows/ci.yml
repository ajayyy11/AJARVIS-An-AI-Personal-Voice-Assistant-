name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A.JARVIS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask python-dotenv pytest mysql-connector-python
      - name: Compile application modules
        run: python -m compileall -q .
      - name: Run session security tests
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
        run: pytest -q tests/test_session_manager.py
