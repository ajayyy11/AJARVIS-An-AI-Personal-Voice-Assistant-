name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ajarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A.JARVIS
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: A.JARVIS/requirements-web.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt mysql-connector-python
      - name: Validate dashboard JavaScript syntax
        shell: bash
        run: |
          node --check static/cloud-dashboard.js
          python - <<'PY'
          from pathlib import Path

          html = Path("templates/dashboard.html").read_text(encoding="utf-8")
          if "cloud-dashboard.js" not in html or "cloud-dashboard.css" not in html:
              raise SystemExit("Dashboard must load its same-origin static assets.")
          if "<script>" in html.lower():
              raise SystemExit("Dashboard must not contain inline scripts.")
          if "</head>" not in html.lower():
              raise SystemExit("Dashboard head element is not closed.")
          if "chart.js" in html.lower():
              raise SystemExit("Dashboard must not load an external chart library.")
          if "new Chart(" in javascript:
              raise SystemExit("Dashboard chart must use the dependency-free SVG renderer.")
          if "<canvas id=\"usageChart\">" in html:
              raise SystemExit("Dashboard analytics must use the accessible SVG chart container.")
          javascript = Path("static/cloud-dashboard.js").read_text(encoding="utf-8")
          if "{{" in javascript or "{%" in javascript:
              raise SystemExit("Unrendered Jinja syntax remains in dashboard JavaScript.")
          PY
      - name: Validate cloud dashboard JavaScript syntax
        shell: bash
        run: |
          node --check static/cloud.js
          node --check static/interface.js
          node --check static/cloud-auth.js
          node --check static/cloud-dashboard.js
          python - <<'PY'
          from pathlib import Path

          html = Path("templates/cloud_auth.html").read_text(encoding="utf-8")
          javascript = Path("static/cloud-auth.js").read_text(encoding="utf-8")
          if "cloud-auth.js" not in html:
              raise SystemExit("Cloud authentication must load its same-origin static script.")
          if "<script>" in html.lower():
              raise SystemExit("Cloud authentication must not contain inline scripts.")
          if "{{" in javascript or "{%" in javascript:
              raise SystemExit("Unrendered Jinja syntax remains in cloud authentication JavaScript.")
          PY
      - name: Validate Render Blueprint
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          blueprint = yaml.safe_load(Path("../render.yaml").read_text(encoding="utf-8"))
          services = blueprint.get("services", [])
          databases = blueprint.get("databases", [])
          cloud = next((item for item in services if item.get("name") == "ajarvis-cloud"), None)
          if cloud is None:
              raise SystemExit("Blueprint must define the AJARVIS cloud service.")
          if databases:
              raise SystemExit("Zero-cost Blueprint must not provision a paid or expiring Render database.")
          if cloud.get("rootDir") != "A.JARVIS":
              raise SystemExit("Cloud service rootDir must be A.JARVIS.")
          if cloud.get("healthCheckPath") != "/readyz":
              raise SystemExit("Cloud service must use /readyz as its health check.")
          if "requirements-web.txt" not in cloud.get("buildCommand", ""):
              raise SystemExit("Cloud build must install the focused web dependencies.")
          if "cloud_app:app" not in cloud.get("startCommand", ""):
              raise SystemExit("Cloud service must run cloud_app:app, not the local webcam app.")
          if not any(
              item.get("key") == "DATABASE_URL" and item.get("sync") is False
              for item in cloud.get("envVars", [])
          ):
              raise SystemExit("Cloud DATABASE_URL must be a manual secret for the external free PostgreSQL provider.")
          if not any(
              item.get("key") == "GEMINI_API_KEY" and item.get("sync") is False
              for item in cloud.get("envVars", [])
          ):
              raise SystemExit("Gemini API key must be configured as a secret.")
          PY
      - name: Compile application modules
        run: python -m compileall -q .
      - name: Set up Node.js for browser smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run browser integration smoke tests
        run: |
          npm install --no-save --no-package-lock jsdom@26.1.0
          python scripts/render_browser_smoke_pages.py /tmp/ajarvis-browser-smoke
          node scripts/browser_smoke.js /tmp/ajarvis-browser-smoke
      - name: Run automated tests
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
        run: pytest -q tests
