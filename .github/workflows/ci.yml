name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A.JARVIS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt mysql-connector-python
      - name: Validate dashboard JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("templates/dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.IGNORECASE | re.DOTALL)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline dashboard scripts were found.")

          javascript = "\n;\n".join(inline_scripts)
          javascript = javascript.replace("{{ user | tojson }}", '"ci-user"')
          if "{{" in javascript or "{%" in javascript:
              raise SystemExit("Unrendered Jinja template syntax remains in dashboard JavaScript.")

          Path("/tmp/ajarvis-dashboard-check.js").write_text(javascript, encoding="utf-8")
          PY
          node --check /tmp/ajarvis-dashboard-check.js
      - name: Validate cloud dashboard JavaScript syntax
        shell: bash
        run: |
          node --check static/cloud.js
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("templates/cloud_auth.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.IGNORECASE | re.DOTALL)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline cloud authentication script was found.")
          javascript = "\n;\n".join(inline_scripts)
          javascript = javascript.replace("{{ mode|tojson }}", '"login"')
          if "{{" in javascript or "{%" in javascript:
              raise SystemExit("Unrendered Jinja syntax remains in cloud authentication JavaScript.")
          Path("/tmp/ajarvis-cloud-auth-check.js").write_text(javascript, encoding="utf-8")
          PY
          node --check /tmp/ajarvis-cloud-auth-check.js
      - name: Validate Render Blueprint
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          blueprint = yaml.safe_load(Path("../render.yaml").read_text(encoding="utf-8"))
          services = blueprint.get("services", [])
          databases = blueprint.get("databases", [])
          cloud = next((item for item in services if item.get("name") == "ajarvis-cloud"), None)
          database = next((item for item in databases if item.get("name") == "ajarvis-cloud-db"), None)
          if cloud is None or database is None:
              raise SystemExit("Blueprint must define the AJARVIS cloud service and persistent database.")
          if cloud.get("rootDir") != "A.JARVIS":
              raise SystemExit("Cloud service rootDir must be A.JARVIS.")
          if cloud.get("healthCheckPath") != "/readyz":
              raise SystemExit("Cloud service must use /readyz as its health check.")
          if "requirements-web.txt" not in cloud.get("buildCommand", ""):
              raise SystemExit("Cloud build must install the focused web dependencies.")
          if "cloud_app:app" not in cloud.get("startCommand", ""):
              raise SystemExit("Cloud service must run cloud_app:app, not the local webcam app.")
          if database.get("plan") == "free":
              raise SystemExit("Production persistence must not use expiring Free Postgres.")
          if not any(
              item.get("key") == "DATABASE_URL"
              and item.get("fromDatabase", {}).get("name") == "ajarvis-cloud-db"
              for item in cloud.get("envVars", [])
          ):
              raise SystemExit("Cloud DATABASE_URL must be bound to the managed PostgreSQL database.")
          PY
      - name: Compile application modules
        run: python -m compileall -q .
      - name: Run automated tests
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
        run: pytest -q tests
