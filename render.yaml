# Render Blueprint for the hosted AJARVIS workspace.
# The web app uses a free compute plan (it spins down when idle).
# PostgreSQL uses a small paid plan for persistent user data; review Render's
# current pricing before applying this Blueprint.
services:
  - type: web
    name: ajarvis-cloud
    runtime: python
    rootDir: A.JARVIS
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 cloud_app:app
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: CLOUD_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ajarvis-cloud-db
          property: connectionString
      - key: SESSION_TIMEOUT_MINUTES
        value: "60"
      - key: MAX_CONTENT_LENGTH_BYTES
        value: "10485760"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_WEB_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: ajarvis-cloud-db
    databaseName: ajarvis
    user: ajarvis
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
