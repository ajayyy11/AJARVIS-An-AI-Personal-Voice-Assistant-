<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJARVIS Login</title>
     <script>
        // Check every 2 seconds if authenticated
        setInterval(function(){
            fetch('/check_access')
            .then(res => res.json())
            .then(data => {
                if(data.access){
                    window.location.href = "/dashboard";
                }
            });
        }, 2000);
    </script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        /* Adjusted to Deep Cyan and Black to match the PNG */
        background: 
            radial-gradient(circle at center, #08121d 20%, #02050a 80%),
            linear-gradient(45deg, rgba(0, 188, 212, 0.05) 0%, rgba(0, 240, 255, 0.05) 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        overflow: hidden;
        position: relative;
    }

    /* Updated particles to Cyan/Blue energy bits */
    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(2px 2px at 20px 30px, #00f0ff, transparent),
            radial-gradient(2px 2px at 40px 70px, #00bcd4, transparent),
            radial-gradient(1px 1px at 90px 40px, #ffffff, transparent),
            radial-gradient(1px 1px at 130px 80px, #00f0ff, transparent);
        background-repeat: repeat;
        background-size: 200px 100px;
        animation: float 20s infinite linear;
        opacity: 0.4;
        pointer-events: none;
    }

    @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-100px) rotate(360deg); }
    }

    /* HUD overlay - Electric Blue Scan Lines */
    .hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            linear-gradient(90deg, transparent 49%, rgba(0, 240, 255, 0.04) 50%, transparent 51%),
            linear-gradient(0deg, transparent 49%, rgba(0, 240, 255, 0.04) 50%, transparent 51%);
        background-size: 50px 50px;
        animation: scan 4s linear infinite;
        pointer-events: none;
    }

    @keyframes scan {
        0% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.05); opacity: 0.6; }
        100% { transform: scale(1); opacity: 0.3; }
    }

    .container {
        text-align: center;
        z-index: 10;
        position: relative;
        padding: 40px 30px;
        background: rgba(8, 18, 29, 0.7); /* Translucent dark blue */
        border-radius: 20px;
        border: 1px solid rgba(0, 240, 255, 0.2);
        box-shadow: 
            0 0 40px rgba(0, 188, 212, 0.3),
            inset 0 0 20px rgba(0, 188, 212, 0.1);
        backdrop-filter: blur(15px);
    }

    /* Arc reactor - Matches the glowing center of the PNG */
    .arc-reactor {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        background: radial-gradient(circle, #fff 0%, #00f0ff 40%, #006677 70%, transparent 100%);
        border-radius: 50%;
        position: relative;
        animation: pulse 2s infinite ease-in-out;
        box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    h2 {
        font-size: 2.2em;
        margin-bottom: 20px;
        /* Silver to Cyan Gradient */
        background: linear-gradient(45deg, #ffffff, #00f0ff, #00bcd4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        font-weight: 800;
        letter-spacing: 3px;
    }

    /* Face Recognition Video/Image Container */
    .video-container {
        position: relative;
        width: 640px;
        height: 480px;
        margin: 0 auto;
        border-radius: 15px;
        overflow: hidden;
        border: 2px solid rgba(0, 240, 255, 0.3);
    }

    img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: brightness(1.1) contrast(1.1) saturate(1.2);
    }

    /* Scrolling Scanning Border - Changed to Blue/White */
    .video-container::before {
        content: '';
        position: absolute;
        top: -3px;
        left: -3px;
        right: -3px;
        bottom: -3px;
        background: conic-gradient(transparent, #00f0ff, #ffffff, transparent 40%);
        border-radius: 15px;
        z-index: 1;
        animation: borderRotate 3s linear infinite;
    }

    /* Scanning Horizontal Line */
    .video-container::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: #00f0ff;
        box-shadow: 0 0 15px #00f0ff, 0 0 5px #fff;
        z-index: 2;
        animation: scanLine 2.5s ease-in-out infinite;
    }

    @keyframes borderRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes scanLine {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
    }

    p {
        margin-top: 25px;
        font-size: 1.1em;
        color: rgba(255, 255, 255, 0.8);
    }

    a {
        color: #00f0ff; /* Changed from yellow to cyan */
        text-decoration: none;
        font-weight: 600;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        transition: all 0.3s ease;
    }

    a:hover {
        color: #fff;
        text-shadow: 0 0 20px #00f0ff;
        letter-spacing: 1px;
    }

    @media (max-width: 768px) {
        .video-container {
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 4 / 3;
        }
    }
</style>
</head>
<body>
    <div class="hud-overlay"></div>
    
    <div class="container">
        <div class="arc-reactor"></div>
        <h2>Face Authentication Required</h2>
        
        
            <img src="{{ url_for('video_feed') }}" width="640" height="480" alt="Face Scan">
    
        <p>
            Don’t have account? <a href="{{ url_for('register')}}">Register Now !</a>
        </p>
        
    </div>
</body>
</html>
